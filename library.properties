sentence=CO2 sensors MH-Z19B, MH-Z19C, MH-Z19E, MH-Z14A over UART: ppm, ventilation rating, calibration, ABC, range, checked replies. No dependencies.
paragraph=Reads Winsen MH-Z19B, MH-Z19C, MH-Z19D, MH-Z19E and MH-Z14A carbon dioxide sensors over UART: read() or non-blocking poll() and update(), co2() in ppm, a verbal ventilation rating, reply checksum verification, zero calibration, ABC auto-calibration switch, measuring range, warm-up tracking. Works with any port (Serial, Serial2, SoftwareSerial). Explains wiring problems in Russian, Kazakh or English. Works on Arduino AVR, ESP32, ESP8266. Examples included, made for classes and kits by Alash Electronics.
